{{ define "main" }}
{{ $lang := .Site.Language.Lang }}

<section class="static-page">
    <div class="container container-narrow">
        <nav class="breadcrumb" aria-label="{{ if eq $lang "en" }}Breadcrumb{{ else }}Fil d'Ariane{{ end }}">
            <ol class="breadcrumb-list">
                <li class="breadcrumb-item">
                    <a href="{{ "/" | relURL }}">{{ if eq $lang "en" }}Home{{ else }}Accueil{{ end }}</a>
                    <svg class="breadcrumb-sep" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 4 10 8 6 12" /></svg>
                </li>
                <li class="breadcrumb-item">
                    <span aria-current="page">{{ .Title }}</span>
                </li>
            </ol>
        </nav>

        <h1 class="static-page-title">{{ .Title }}</h1>
        {{ with .Description }}
        <p class="static-page-lead">{{ . }}</p>
        {{ end }}

        <div class="prose article-content static-page-content">
            {{ .Content }}
        </div>
    </div>
</section>

{{ end }}
