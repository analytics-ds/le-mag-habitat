  jobTitle:
    fr: Décoratrice d'intérieur
    en: Interior decorator
  role:
    fr: Experte déco & astuces maison
    en: Decor & home tips expert
  bio:
    fr: "J'exerce comme décoratrice d'intérieur depuis huit ans, principalement auprès de particuliers qui veulent transformer leur logement sans tout casser ni tout racheter. J'ai appris à tirer le meilleur parti des petits espaces, à dénicher des astuces de rangement qui fonctionnent vraiment au quotidien, et à entretenir une maison au naturel sans perdre des heures. Je partage ici mes conseils pour aménager à petit budget et garder un intérieur agréable à vivre, sans jamais sacrifier le style."
    en: "I've worked as an interior decorator for eight years, mostly with homeowners who want to transform their space without knocking down walls or buying everything new. I've learned how to make the most of small spaces, find storage tricks that actually work day to day, and keep a home clean and natural without wasting hours on it. Here, I share my tips for decorating on a small budget and keeping a home pleasant to live in, without ever sacrificing style."
  expertise:
