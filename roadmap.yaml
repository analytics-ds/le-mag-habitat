# Roadmap editoriale evergreen - Le Mag Habitat
#
# Articles SEO informationnels, full auto via /create-article-auto.
# Cadence : 2 publications par semaine (mardi + vendredi).
# Source mots-cles : feuille Google Sheets "Roadmap SEO - Le Mag Habitat"
# (https://docs.google.com/spreadsheets/d/1ZBShGV1lBE72pNEgmt5Rek6XpwO9KDaxLrYpMYGvKdA),
# import du 2026-09-24, 53 entrees (25 "Oui" + 28 "Oui - retravailler angle").
#
# Aucun champ d'angle n'est reporte ici volontairement : le titre et l'angle sont
# toujours generes par l'agent a partir du mot-cle et de l'analyse SERP (etape 2 du
# SKILL.md), jamais copies depuis un angle suggere. C'est ce qui permet de couvrir
# aussi les sujets marques "a retravailler" sans reprendre un angle deja ecarte.
#
# Ordre : round-robin par thematique (volume decroissant au sein de chaque
# thematique) pour alterner les categories a chaque publication.
#
# Format documente dans .claude/templates/roadmap-template.yaml

